services:
  api:
    build:
      context: ./backend
    ports:
      - "8087:8087"
    restart: unless-stopped
    environment:
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-superbox-1350226447}
      COS_REGION: ${COS_REGION:-ap-tokyo}
      COS_CUSTOM_DOMAIN: ${COS_CUSTOM_DOMAIN:-superboxfiles.fiacloud.top}
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
